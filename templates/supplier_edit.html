{% extends "base.html" %}
{% block title %}编辑发货记录{% endblock %}
{% block navbar %}
    <a href="/supplier/dashboard" class="btn btn-sm btn-outline">返回列表</a>
{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;">
    <h2>编辑发货记录</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label>项目 *</label>
                <select name="project_id" class="form-control" required>
                    <option value="">请选择项目</option>
                    {% for p in projects %}
                    <option value="{{ p.id }}" {% if item.project_id == p.id %}selected{% endif %}>{{ p.code }} - {{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>发货日期</label>
                <input type="date" name="ship_date" class="form-control" value="{{ item.ship_date or '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>发货商品名称</label>
                <input type="text" name="product_name" class="form-control" value="{{ item.product_name or '' }}">
            </div>
            <div class="form-group">
                <label>型号</label>
                <input type="text" name="product_model" class="form-control" value="{{ item.product_model or '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>采购订单号</label>
                <input type="text" name="purchase_order" class="form-control" value="{{ item.purchase_order or '' }}">
            </div>
            <div class="form-group">
                <label>客户订单号</label>
                <input type="text" name="customer_order" class="form-control" value="{{ item.customer_order or '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>物流单号</label>
                <input type="text" name="logistics_no" class="form-control" value="{{ item.logistics_no or '' }}">
            </div>
            <div class="form-group">
                <label>物流回单（附件，5MB以内）</label>
                <input type="file" name="logistics_receipt_file" class="form-control" accept="image/*,.pdf">
                {% if item.logistics_receipt_file %}
                <span style="font-size:12px;color:var(--text-light);">已上传：<a href="/uploads/{{ item.logistics_receipt_file }}" target="_blank">查看附件</a>，上传新文件将替换</span>
                {% endif %}
            </div>
        </div>
        <div class="form-group">
            <label>备注</label>
            <textarea name="remark" class="form-control" rows="2">{{ item.remark or '' }}</textarea>
        </div>
        <div style="margin-top:20px;">
            <button type="submit" class="btn btn-primary">保存修改</button>
            <a href="/supplier/dashboard" class="btn btn-outline" style="margin-left:12px;">取消</a>
        </div>
    </form>
</div>
{% endblock %}
