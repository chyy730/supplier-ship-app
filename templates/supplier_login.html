{% extends "base.html" %}
{% block title %}供应商登录{% endblock %}
{% block navbar %}
    <a href="/" class="btn btn-sm btn-outline">返回首页</a>
{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:60px auto;">
    <h2 style="text-align:center;">供应商登录</h2>
    {% if error %}
    <div class="alert alert-danger">用户名或密码错误，请重试</div>
    {% endif %}
    <form method="POST">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" required placeholder="请输入供应商账号">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" class="form-control" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">登录</button>
    </form>
</div>
{% endblock %}
