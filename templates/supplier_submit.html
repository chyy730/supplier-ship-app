{% extends "base.html" %}
{% block title %}新增发货记录{% endblock %}
{% block navbar %}
    <a href="/supplier/dashboard" class="btn btn-sm btn-outline">返回列表</a>
    <a href="/supplier/logout" class="btn btn-sm btn-outline" style="color:#dc3545;border-color:#dc3545;">退出</a>
{% endblock %}
{% block content %}
<div class="card" style="max-width:700px;">
    <h2>新增发货记录</h2>
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label>项目 *</label>
                <select name="project_id" class="form-control" required>
                    <option value="">请选择项目</option>
                    {% for p in projects %}
                    <option value="{{ p.id }}">{{ p.code }} - {{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>发货日期</label>
                <input type="date" name="ship_date" class="form-control">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>发货商品名称</label>
                <input type="text" name="product_name" class="form-control" placeholder="请输入商品名称">
            </div>
            <div class="form-group">
                <label>型号</label>
                <input type="text" name="product_model" class="form-control" placeholder="请输入商品型号">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>采购订单号</label>
                <input type="text" name="purchase_order" class="form-control" placeholder="请输入采购订单号">
            </div>
            <div class="form-group">
                <label>客户订单号</label>
                <input type="text" name="customer_order" class="form-control" placeholder="请输入客户订单号">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>物流单号</label>
                <input type="text" name="logistics_no" class="form-control" placeholder="请输入物流单号">
            </div>
            <div class="form-group">
                <label>物流回单（附件，5MB以内）</label>
                <input type="file" name="logistics_receipt_file" class="form-control" accept="image/*,.pdf">
            </div>
        </div>
        <div class="form-group">
            <label>备注</label>
            <textarea name="remark" class="form-control" rows="2" placeholder="备注信息（选填）"></textarea>
        </div>
        <div style="margin-top:20px;">
            <button type="submit" class="btn btn-primary">提交</button>
            <a href="/supplier/dashboard" class="btn btn-outline" style="margin-left:12px;">取消</a>
        </div>
    </form>
</div>
{% endblock %}
