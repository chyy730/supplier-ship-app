<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}供应商发货信息收集{% endblock %}</title>
    <style>
        :root {
            --primary: #e60012;
            --primary-dark: #b3000e;
            --primary-light: #ff4d5a;
            --bg: #f5f7fa;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
            --white: #ffffff;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        .navbar {
            background: var(--white);
            box-shadow: var(--shadow);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
        }
        .navbar-links a {
            color: var(--text);
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .navbar-links a:hover { background: #f0f0f0; }
        .navbar-links a.btn-primary {
            background: var(--primary);
            color: white;
        }
        .navbar-links a.btn-primary:hover { background: var(--primary-dark); }
        .container {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 16px; }
        h2 { font-size: 20px; margin-bottom: 12px; }
        .btn {
            display: inline-block;
            padding: 8px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover { background: #fff5f5; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th {
            background: var(--primary);
            color: white;
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            white-space: nowrap;
        }
        table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }
        table tr:hover { background: #fafafa; }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(230,0,18,0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-danger { background: #fff5f5; color: #dc3545; border: 1px solid #ffcdd2; }
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-item {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px 24px;
            flex: 1;
            text-align: center;
        }
        .stat-number { font-size: 28px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 13px; color: var(--text-light); margin-top: 4px; }
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-bar .form-group { margin-bottom: 0; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
        }
        .hero h1 { font-size: 36px; margin-bottom: 12px; }
        .hero p { color: var(--text-light); font-size: 16px; margin-bottom: 24px; }
        .actions-cell { white-space: nowrap; }
        .actions-cell .btn { margin-right: 4px; }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .stats-bar { flex-direction: column; }
            .filter-bar { flex-direction: column; }
            table { font-size: 12px; }
            table th, table td { padding: 6px 8px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">供应商发货信息收集</a>
        <div class="navbar-links">
            {% block navbar %}{% endblock %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
